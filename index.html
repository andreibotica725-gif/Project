<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Note</title>
<meta name="description" content="Personal routine, goals, events and notes.">
<meta name="theme-color" content="#0b0b0c">
<meta name="application-name" content="Note">
<meta name="apple-mobile-web-app-title" content="Note">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#0b0b0c; --bg1:#111113; --bg2:#151517;
  --s1:#1b1b1e; --s2:#232327; --s3:#2c2c31; --s4:#38383e;
  --tx:#ededed; --tx2:#a0a0a0; --tx3:#7b7f7d; --tx4:#55585a;
  --white:#f4f4f2; --ash:#b2beb5;
  --ev:#3560c4; --ev-tx:#7d9df0; --dl:#28344b; --dl-tx:#8d9cb9;
  --hov:rgba(255,255,255,.035); --hov2:rgba(255,255,255,.06);
  --ease:cubic-bezier(.2,.7,.2,1);
  --font:'Geist',Arial,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg0);color:var(--tx);font:500 14px/1.5 var(--font);-webkit-font-smoothing:antialiased;display:grid;grid-template-columns:5% 35% 60%;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit;border:0;outline:0;background:none}
input::placeholder{color:var(--tx4)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
::-webkit-calendar-picker-indicator{filter:invert(.65);cursor:pointer}
::selection{background:rgba(178,190,181,.28)}
*{scrollbar-width:thin;scrollbar-color:var(--s3) transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--s3);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--s4)}
.ic{width:18px;height:18px;flex:none;display:block}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--tx3);font-size:13px}
.grow{flex:1}

@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.98)}to{opacity:1;transform:none}}

/* tooltips */
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;white-space:nowrap;pointer-events:none;background:var(--s4);color:var(--tx);font:500 12px/1 var(--font);padding:7px 9px;border-radius:7px;opacity:0;z-index:60;left:50%;top:calc(100% + 8px);transform:translate(-50%,-3px);transition:opacity .15s,transform .15s}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;transform:translate(-50%,0);transition-delay:.5s}
[data-tip=""]::after{display:none}
[data-tip-pos=right]::after{left:calc(100% + 12px);top:50%;transform:translate(-4px,-50%)}
[data-tip-pos=right]:hover::after{transform:translate(0,-50%)}
[data-tip-pos=left]::after{left:auto;right:0;transform:translate(0,-3px)}
[data-tip-pos=left]:hover::after{transform:none}

button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
.ed-body:focus-visible{outline:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* tool-bar */
#toolbar{background:var(--bg0);display:flex;flex-direction:column;align-items:center;padding:22px 0;gap:30px;position:relative;z-index:30}
.tb-group{display:flex;flex-direction:column;gap:6px}
.tb-btn{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:var(--tx3);transition:background .2s,color .2s}
.tb-btn:hover{background:var(--hov);color:var(--tx)}
.tb-btn.is-active{background:var(--s2);color:var(--white)}
.tb-btn .ic{width:20px;height:20px}

/* task-list */
#list{background:var(--bg1);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.l-head{padding:28px 28px 16px}
.day-nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
.day-title{flex:1;display:flex;flex-direction:column;align-items:center;padding:4px 8px;border-radius:10px;transition:background .2s}
.day-title:not(:disabled):hover{background:var(--hov)}
.day-title:disabled{cursor:default}
.day-title .cal-title{font-size:22px;line-height:1.25}
.l-next{font-size:12px;color:var(--tx3);margin-top:8px}
.l-day{font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.l-date{color:var(--tx3);font-size:13px;margin-top:1px}
.nav{display:flex;gap:4px;align-items:center}
.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--tx2);transition:background .2s,color .2s,opacity .2s;flex:none}
.icon-btn:hover{background:var(--hov);color:var(--white)}
.icon-btn.is-on{background:var(--s2);color:var(--white)}
.icon-btn.primary{background:var(--white);color:#111}
.icon-btn.primary:hover{background:#fff;color:#000}
.icon-btn.primary:disabled{opacity:.3;cursor:default}
.text-btn{height:32px;padding:0 12px;border-radius:9px;color:var(--tx2);font-size:13px;transition:background .2s,color .2s}
.text-btn:hover{background:var(--hov);color:var(--white)}
.text-btn.is-dim{opacity:.4;cursor:default}
.text-btn.is-dim:hover{background:none;color:var(--tx2)}
.prog-wrap{display:flex;align-items:center;gap:12px;margin-top:18px}
.prog{flex:1;height:4px;background:var(--s2);border-radius:4px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--ash);border-radius:4px;transition:width .7s cubic-bezier(.65,0,.35,1)}
.prog-t{font-size:12px;color:var(--tx3);white-space:nowrap}
.rows{flex:1;overflow-y:auto;padding:4px 16px 28px;touch-action:pan-y}
.rows.anim{animation:fade .25s ease}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;cursor:pointer;transition:background .18s,opacity .2s;margin-bottom:2px}
.row:hover{background:var(--hov)}
.row.is-sel{background:var(--s2)}
.row .check{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--tx4);transition:color .2s;flex:none}
.row .check:hover{color:var(--tx)}
.row .check .ic{width:25px;height:25px}
.row.is-done .check{color:var(--ash)}
.r-main{flex:1;min-width:0}
.r-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;transition:color .2s}
.r-meta{font-size:12px;color:var(--tx3);margin-top:1px}
.r-time{font-size:13px;font-weight:600;color:var(--tx2);white-space:nowrap;font-variant-numeric:tabular-nums;transition:color .2s}
.r-any{font-size:12px;color:var(--tx4);white-space:nowrap}
.row.is-done .r-title{color:var(--tx3)}
.row.is-done .r-meta,.row.is-done .r-time{color:var(--tx4)}
.row.is-draft{opacity:.7;cursor:default}
.grp{font-size:12px;color:var(--tx3);padding:14px 12px 6px}
.grp:first-child{padding-top:4px}
.row{position:relative}
.row.is-now::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--white)}
.row.is-now .r-time{color:var(--white)}
.row.is-late .r-title,.row.is-late .r-time{color:var(--tx3)}
.now-line{display:flex;align-items:center;gap:8px;margin:2px 12px;height:14px}
.now-line::after{content:"";flex:1;height:1.5px;border-radius:1px;background:var(--ev)}
.now-line span{font-size:11px;font-weight:700;color:var(--ev-tx);font-variant-numeric:tabular-nums}
.row.just-done .check{animation:checkpop .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes checkpop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.prog-wrap.is-all .prog span{background:var(--white)}
.prog-wrap.is-all .prog-t{color:var(--white)}
.empty .text-btn{margin-top:4px;background:var(--s2)}
.row-input{background:var(--s1);cursor:text}
.row-input .lead{width:26px;height:26px;display:grid;place-items:center;color:var(--tx4);flex:none}
.row-input input{flex:1;font-weight:600;min-width:0}
.r-snip{font-size:12px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.r-date{font-size:12px;color:var(--tx3);align-self:flex-start;margin-top:2px;white-space:nowrap}
.empty{padding:56px 12px;color:var(--tx3);font-size:13px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ic{width:26px;height:26px;color:var(--tx4)}

/* info-space */
#info{background:var(--bg2);overflow-y:auto;overflow-x:hidden;position:relative}
.view{padding:28px 44px 64px;max-width:1040px}
.view.enter{animation:enter .32s var(--ease)}
.item-head{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.head-title{flex:1;min-width:0}
.kind{font-size:12px;color:var(--tx3);margin-bottom:2px}
.head-title h1,.cal-title{font-size:26px;font-weight:600;letter-spacing:-.015em;line-height:1.25;word-break:break-word}
.title-edit{width:100%;font-size:26px;font-weight:600;letter-spacing:-.015em;line-height:1.25;padding:0}
.actions{display:flex;gap:4px}
.actions.edit-acts{gap:14px}
.notes-head{display:flex;flex-direction:column;align-items:center;text-align:center}
.icon-btn.back-btn:hover{background:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:30px}
.stat{background:var(--s1);border-radius:14px;padding:14px 16px;transition:background .2s}
.stat:focus-within{background:var(--s2)}
.stat-l{display:flex;gap:7px;align-items:center;color:var(--tx3);font-size:12px}
.req{margin-left:auto;color:var(--tx4);font-size:11px}
.stat-v{margin-top:6px;font-size:16px;font-weight:600;min-height:24px;font-variant-numeric:tabular-nums}
.none{color:var(--tx4);font-weight:500}
.inrow{display:flex;align-items:center;gap:2px}
.bare{font-size:16px;font-weight:600;width:100%;padding:0;font-variant-numeric:tabular-nums}
.bare.num{width:1ch;min-width:1ch;text-align:left;box-sizing:content-box;padding:0}
.unit{color:var(--tx);font-size:16px;font-weight:600;margin:0 14px 0 4px;font-variant-numeric:tabular-nums}
.mini{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--tx3);transition:background .2s,color .2s;flex:none}
.mini:hover{background:var(--hov2);color:var(--white)}
.mini .ic{width:14px;height:14px}
.sec-l{font-size:12px;color:var(--tx3);margin:0 0 10px;display:flex;align-items:center;gap:7px}
.block{background:var(--s1);border-radius:14px;padding:14px 16px;margin-bottom:30px;display:flex;flex-direction:column;gap:12px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--s2);border-radius:10px;padding:3px;gap:2px;align-self:flex-start}
.seg button{height:30px;min-width:34px;padding:0 12px;border-radius:8px;color:var(--tx2);font-size:13px;display:grid;place-items:center;transition:background .2s,color .2s}
.seg button:hover{color:var(--white)}
.seg button.on{background:var(--s4);color:var(--white)}
.seg button .ic{width:15px;height:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{height:30px;padding:0 12px;border-radius:15px;background:var(--s2);color:var(--tx2);font-size:13px;display:inline-flex;align-items:center;gap:4px;transition:background .2s,color .2s}
button.chip:hover{color:var(--white)}
.chip.on{background:var(--white);color:#111}
.chip button{display:grid;place-items:center;color:var(--tx3);margin-right:-6px;width:20px;height:20px;border-radius:50%}
.chip button:hover{color:var(--white);background:var(--hov2)}
.chip button .ic{width:12px;height:12px}
.field-s{background:var(--s2);border-radius:8px;padding:5px 10px;font-size:13px}
.inl{display:flex;align-items:center;gap:10px;color:var(--tx3);font-size:13px}
.foot{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:24px}
.btn{height:38px;padding:0 18px;border-radius:10px;font-weight:600;transition:background .2s,opacity .2s,transform .1s,color .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--white);color:#111}
.btn.primary:hover{background:#fff}
.btn.ghost{color:var(--tx2)}
.btn.ghost:hover{background:var(--hov);color:var(--white)}
.btn.sm{height:32px;padding:0 14px;font-size:13px}

/* pickers */
.pick{font-size:16px;font-weight:600;color:var(--tx);padding:0;text-align:left;font-variant-numeric:tabular-nums;transition:color .2s}
.pick:hover{color:var(--white)}
.pick.empty{color:var(--tx4)}
.pick.sm{font-size:13px;background:var(--s2);padding:6px 12px;border-radius:8px;transition:background .2s,color .2s}
.pick.sm:hover{background:var(--hov2)}
.pop.dp{width:286px}
.dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:600;font-size:14px}
.dp-wd,.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-wd span{font-size:11px;color:var(--tx4);text-align:center;padding:4px 0}
.dp-d{width:34px;height:34px;border-radius:50%;justify-self:center;font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums;transition:background .15s,color .15s}
.dp-d:hover{background:var(--hov2);color:var(--white)}
.dp-d.today{color:var(--white);font-weight:700}
.dp-d.on{background:var(--white);color:#111;font-weight:700}
.pop.tp-pop{width:200px}
.tp-lab{display:flex;font-size:11px;color:var(--tx4);margin-bottom:6px}
.tp-lab span{flex:1;text-align:center}
.tp{display:flex;gap:6px}
.tp-col{flex:1;height:216px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.tp-col button{height:32px;flex:none;border-radius:8px;font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums;transition:background .15s,color .15s}
.tp-col button:hover{background:var(--hov2);color:var(--white)}
.tp-col button.on{background:var(--white);color:#111;font-weight:700}
.tp-val{font-weight:700;font-variant-numeric:tabular-nums}
.pop .text-btn{background:var(--s3)}

/* rich text */
.rich{font-size:15px;line-height:1.7;color:var(--tx);font-weight:500;word-wrap:break-word}
.rich h1{font-size:24px;font-weight:700;line-height:1.3;margin:.7em 0 .3em;letter-spacing:-.01em}
.rich h2{font-size:20px;font-weight:700;line-height:1.35;margin:.7em 0 .3em}
.rich h3{font-size:17px;font-weight:600;margin:.6em 0 .25em}
.rich > :first-child{margin-top:0}
.rich > :not(table){max-width:72ch}
.rich p{margin:.2em 0}
.rich ul,.rich ol{padding-left:1.5em;margin:.35em 0}
.rich li{margin:.12em 0;padding-left:.2em}
.rich li::marker{color:var(--tx3)}
.rich blockquote{margin:0 0 0 2em}
.rich b,.rich strong{font-weight:700}
.rich table{border-collapse:separate;border-spacing:0;margin:.7em 0;min-width:55%;border:1px solid var(--s3);border-radius:12px;overflow:hidden}
.rich td,.rich th{background:none;padding:8px 14px;vertical-align:top;min-width:64px;text-align:left;font-weight:500;border-right:1px solid var(--s3);border-bottom:1px solid var(--s3);transition:background .15s}
.rich td:last-child,.rich th:last-child{border-right:0}
.rich tr:last-child>td,.rich tr:last-child>th{border-bottom:0}

/* editor */
.editor{background:var(--s1);border-radius:16px}
.ed-bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:8px;background:var(--s1);border-radius:16px 16px 0 0}
.eb{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--tx2);transition:background .18s,color .18s}
.eb:hover{background:var(--hov2);color:var(--white)}
.eb.is-on{background:var(--s3);color:var(--white)}
.eb .ic{width:17px;height:17px}
.ed-bar .gap{width:10px;flex:none}
.dd{height:32px;padding:0 8px 0 10px;border-radius:8px;color:var(--tx2);font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:background .18s,color .18s}
.dd:hover{background:var(--hov2);color:var(--white)}
.dd .ic{width:13px;height:13px;color:var(--tx3)}
.dd[data-dd=block]{min-width:112px;justify-content:space-between}
.pop.menu-pop{width:auto;min-width:170px;padding:6px}
.menu{display:flex;flex-direction:column;gap:1px}
.mi{display:flex;align-items:center;justify-content:space-between;gap:16px;height:34px;padding:0 10px;border-radius:8px;color:var(--tx2);text-align:left;transition:background .15s,color .15s}
.mi:hover{color:var(--white)}
.mi.on{color:var(--white)}
.mi .ic{width:14px;height:14px}
.mi-block-h1{font-size:18px;font-weight:700}.mi-block-h2{font-size:16px;font-weight:700}.mi-block-h3{font-size:14px;font-weight:600}
.mi-size-13px{font-size:12px}.mi-size-15px{font-size:14px}.mi-size-19px{font-size:17px}.mi-size-25px{font-size:21px}
.tbl-tools{display:none;align-items:center;gap:2px}
.tbl-tools.on{display:flex;animation:fade .2s}
.tbl-tools.idle .eb,.tbl-tools .eb.off{opacity:.3;pointer-events:none}
.ed-body{min-height:240px;padding:12px 22px 24px;outline:0}
.ed-body:empty::before{content:attr(data-ph);color:var(--tx4)}
.ed-body td.sel{background:rgba(178,190,181,.16)}
.ed-body td.flash{background:var(--ash);color:#111}

/* calendar */
.cal-head{margin-bottom:26px}
.months{display:grid;grid-template-columns:1fr 1fr;gap:40px;touch-action:pan-y;user-select:none;cursor:grab;transition:transform .25s var(--ease)}
.months.dragging{transition:none;cursor:grabbing}
.months.slide-next,.rows.slide-next{animation:slideNext .32s var(--ease)}
.months.slide-prev,.rows.slide-prev{animation:slidePrev .32s var(--ease)}
@keyframes slideNext{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slidePrev{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.m-name{font-size:15px;font-weight:600;margin-bottom:12px}
.m-name span{color:var(--tx3);font-weight:500}
.wd,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days{justify-items:center}
.wd span{font-size:11px;color:var(--tx4);text-align:center;padding-bottom:6px}
.day{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:var(--tx2);transition:background .18s,color .18s;position:relative;font-variant-numeric:tabular-nums}
.day:hover{color:var(--white)}
.day.is-past{color:var(--tx4)}
.day.is-dl{background:var(--dl);color:#cfd7e6}
.day.is-ev{background:var(--ev);color:#fff}
.day.is-sel{color:var(--white);font-weight:700}
.day.is-today,.day.is-today.is-sel{background:var(--white);color:#111;font-weight:700}
.day.is-both{box-shadow:inset 0 0 0 2px #7f93bd}
.day.is-dl:hover,.day.is-ev:hover,.day.is-today:hover{filter:brightness(1.1)}
.day.is-sel::after{content:"";position:absolute;bottom:9px;left:50%;width:12px;height:2px;border-radius:2px;background:currentColor;transform:translateX(-50%)}
.cal-bottom{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:38px}
.sec-h{font-size:13px;color:var(--tx3);margin-bottom:8px;padding-left:12px}
.cal-bottom .muted{padding-left:12px}
.it{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;transition:background .18s}
.it:hover{background:var(--hov)}
.it > .ic{width:16px;height:16px}
.it.ev > .ic{color:var(--ev-tx)}
.it.dl > .ic{color:var(--dl-tx)}
.it-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.it-r{font-size:12px;color:var(--tx3);display:flex;gap:10px;white-space:nowrap}
.it-r .mono{color:var(--tx2);font-weight:600}
.it.is-done .it-t{color:var(--tx3)}

/* popovers */

const addMonths=(s,n)=>{const d=pd(s);return iso(new Date(d.getFullYear(),d.getMonth()+n,1))};
const diffDays=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const fmtLong=s=>{const d=pd(s);return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`};
const fmtFull=s=>{const d=pd(s);return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`};
const fmtShort=s=>{const d=pd(s);return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`};
const fmtDur=m=>{m=+m||0;if(!m)return '';const h=Math.floor(m/60),r=m%60;return h?(r?`${h} h ${r} min`:`${h} h`):`${r} min`};
const endTime=(t,dur)=>{const[h,m]=t.split(':').map(Number);const x=(h*60+m+(+dur||0))%1440;return `${pad(Math.floor(x/60))}:${pad(x%60)}`};
const relDays=s=>{const n=diffDays(todayISO(),s);if(n===0)return 'Today';if(n===1)return 'Tomorrow';if(n===-1)return 'Yesterday';return n>0?`In ${n} days`:`${-n} days ago`};
const monthStart=s=>{const d=pd(s);return iso(new Date(d.getFullYear(),d.getMonth(),1))};

const STUDY_HTML="<h1>Computer Science &amp; Engineering Foundations</h1><p>These subjects provide the theoretical understanding necessary to understand what happens beneath the software you build.</p><h2 data-sa=\"sa-computer-science-fundamentals\">Computer Science Fundamentals</h2><ul><li>Algorithms and computational complexity (Big O).</li><li>Data structures and abstract data types.</li><li>Discrete mathematics and mathematical logic.</li><li>Boolean algebra and set theory.</li><li>Graph theory and combinatorics.</li><li>Automata theory and formal languages.</li><li>Computability and complexity theory.</li><li>Programming paradigms.</li><li>Compiler and interpreter fundamentals.</li><li>Software execution models.</li></ul><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>Introduction to Algorithms</i></b>, 4th ed. (2022), by Cormen, Leiserson, Rivest, Stein.</li><li><b><i>Discrete Mathematics and Its Applications</i></b>, 9th ed. (2025), by Kenneth H. Rosen.</li><li><b><i>Introduction to the Theory of Computation</i></b>, 3rd ed. (2012), by Michael Sipser.</li><li><b><i>Engineering a Compiler</i></b>, 3rd ed. (2022), by Cooper, Torczon.</li><li><b><i>Concepts, Techniques, and Models of Computer Programming</i></b>, 1st ed. (2004), by Van Roy, Haridi.</li></ul><h2 data-sa=\"sa-mathematics-for-software-engineering\">Mathematics for Software Engineering</h2><ul><li>Linear algebra.</li><li>Calculus and differential equations (relevant applications).</li><li>Probability and statistics.</li><li>Number theory.</li><li>Discrete mathematics.</li><li>Numerical methods and optimization.</li><li>Information theory.</li><li>Cryptographic mathematics.</li><li>Logic and mathematical proofs.</li></ul><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>Advanced Engineering Mathematics</i></b>, 10th ed. (2011), by Erwin Kreyszig.</li><li><b><i>Introduction to Probability</i></b>, 2nd ed. (2019), by Blitzstein, Hwang.</li><li><b><i>Discrete Mathematics and Its Applications</i></b>, 9th ed. (2025), by Kenneth H. Rosen.</li><li><b><i>An Introduction to Mathematical Cryptography</i></b>, 2nd ed. (2014), by Hoffstein, Pipher, Silverman.</li><li><b><i>Elements of Information Theory</i></b>, 2nd ed. (2006), by Cover, Thomas.</li><li><b><i>How to Prove It</i></b>, 3rd ed. (2019), by Daniel J. Velleman.</li></ul><h2 data-sa=\"sa-computer-architecture-hardware\">Computer Architecture &amp; Hardware</h2><ul><li>Digital logic and circuit fundamentals.</li><li>CPU architecture and instruction sets.</li><li>Registers, memory hierarchy and cache.</li><li>RAM, ROM and persistent storage.</li><li>GPU architecture and parallel processing.</li><li>Binary, hexadecimal and data representation.</li><li>Assembly language.</li><li>Hardware interfaces and communication buses.</li><li>Embedded systems and microcontrollers.</li><li>Virtualization at the hardware level.</li></ul><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>Digital Design and Computer Architecture: RISC-V Edition</i></b>, 1st ed. (2021), by Harris, Harris.</li><li><b><i>Computer Architecture: A Quantitative Approach</i></b>, 7th ed. (2025), by Hennessy, Patterson, Kozyrakis.</li><li><b><i>Computer Systems: A Programmer's Perspective</i></b>, 3rd ed. (2015), by Bryant, O'Hallaron.</li><li><b><i>Making Embedded Systems</i></b>, 2nd ed. (2024), by Elecia White.</li></ul><h2 data-sa=\"sa-programming-languages-software-development-fundamentals\">Programming Languages &amp; Software Development Fundamentals</h2><ul><li>Programming logic and problem-solving.</li><li>Procedural programming.</li><li>Object-oriented programming.</li><li>Functional programming.</li><li>Declarative programming.</li><li>Event-driven and asynchronous programming.</li><li>Memory management and garbage collection.</li><li>Static and dynamic typing.</li><li>Error handling and debugging.</li><li>Concurrency and parallelism.</li><li>Language interoperability and foreign-function interfaces.</li><li>Version control (Git).</li><li>Code quality, refactoring and maintainability.</li></ul><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>The Pragmatic Programmer</i></b>, 20th anniversary ed. (2019), by Thomas, Hunt.</li><li><b><i>Refactoring</i></b>, 2nd ed. (2018), by Martin Fowler.</li><li><b><i>Pro Git</i></b>, 2nd ed. (2014, free online), by Chacon, Straub.</li></ul><h2 data-sa=\"sa-essential-language-coverage\">Essential language coverage</h2><ul><li>C and C++ — systems and performance.</li><li>Python — automation, scripting, data and AI.</li><li>JavaScript and TypeScript — web and application development.</li><li>Java or C# — enterprise applications.</li><li>SQL — relational databases.</li><li>Rust or Go — systems and infrastructure.</li><li>Bash and PowerShell — operating system automation.</li><li>Assembly — low-level understanding.</li></ul><p>You do not need to master every language equally. You need to understand the paradigms and be able to work proficiently in the languages relevant to your systems.</p><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>Modern C</i></b>, 3rd ed. (2025), by Jens Gustedt.</li><li><b><i>Programming: Principles and Practice Using C++</i></b>, 3rd ed. (2024), by Bjarne Stroustrup.</li><li><b><i>Fluent Python</i></b>, 2nd ed. (2022), by Luciano Ramalho.</li><li><b><i>JavaScript: The Definitive Guide</i></b>, 7th ed. (2020), by David Flanagan.</li><li><b><i>Effective TypeScript</i></b>, 2nd ed. (2024), by Dan Vanderkam.</li><li><b><i>Effective Java</i></b>, 3rd ed. (2018), by Joshua Bloch.</li><li><b><i>C# 12 in a Nutshell</i></b>, 2023 edition, by Joseph Albahari.</li><li><b><i>Learning SQL</i></b>, 3rd ed. (2020), by Alan Beaulieu.</li><li><b><i>The Rust Programming Language</i></b>, 3rd ed. (2026), by Klabnik, Nichols, Krycho.</li><li><b><i>Learning Go</i></b>, 2nd ed. (2024), by Jon Bodner.</li><li><b><i>The Linux Command Line</i></b>, 2nd ed. (2019), by William Shotts.</li><li><b><i>Learn PowerShell in a Month of Lunches</i></b>, 4th ed. (2022), by Plunk, Petty, Leonhardt, Hicks.</li><li><b><i>x64 Assembly Language Step-by-Step</i></b>, 4th ed. (2023), by Jeff Duntemann.</li></ul><h1>Systems Engineering &amp; Infrastructure</h1><h2 data-sa=\"sa-operating-systems-systems-programming\">Operating Systems &amp; Systems Programming</h2><ul><li>Operating system architecture.</li><li>Linux administration and internals.</li><li>Windows administration and internals.</li><li>Processes and threads.</li><li>CPU scheduling.</li><li>Memory management and virtual memory.</li><li>Filesystems and storage management.</li><li>Kernel architecture and system calls.</li><li>Permissions, users and access control.</li><li>Drivers and hardware communication.</li><li>System programming.</li><li>Shell scripting and automation.</li><li>System services and daemons.</li><li>Boot processes and initialization.</li><li>Logs, diagnostics and system troubleshooting.</li></ul><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>Operating Systems: Three Easy Pieces</i></b>, 2018, updated online, by Arpaci-Dusseau, Arpaci-Dusseau.</li><li><b><i>The Linux Programming Interface</i></b>, 1st ed. (2010), by Michael Kerrisk.</li><li><b><i>How Linux Works</i></b>, 3rd ed. (2021), by Brian Ward.</li><li><b><i>Windows Internals, Part 1 and Part 2</i></b>, 7th ed. (2017 and 2021), by Yosifovich, Allievi, Russinovich, Ionescu, Solomon.</li></ul><h2 data-sa=\"sa-computer-networking-internet-architecture\">Computer Networking &amp; Internet Architecture</h2><ul><li>OSI and TCP/IP models.</li><li>IP addressing, subnetting and CIDR.</li><li>IPv4 and IPv6.</li><li>TCP, UDP and ICMP.</li><li>DNS and domain infrastructure.</li><li>HTTP and HTTPS.</li><li>TLS and SSL.</li><li>Routing and switching.</li><li>Firewalls and network segmentation.</li><li>VLANs and VPNs.</li><li>NAT and proxy servers.</li><li>Load balancing.</li><li>Network sockets and communication protocols.</li><li>Wireless networking.</li><li>Network monitoring and packet analysis.</li><li>CDNs and edge networking.</li><li>BGP and internet routing fundamentals.</li></ul><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>Computer Networking: A Top-Down Approach</i></b>, 9th ed. (2025), by Kurose, Ross.</li><li><b><i>TCP/IP Illustrated, Volume 1</i></b>, 2nd ed. (2011), by Fall, Stevens.</li><li><b><i>Bulletproof TLS and PKI</i></b>, 2nd ed. (2022), by Ivan Ristić.</li><li><b><i>Practical Packet Analysis</i></b>, 3rd ed. (2017), by Chris Sanders.</li></ul><h2 data-sa=\"sa-servers-hosting-infrastructure-engineering\">Servers, Hosting &amp; Infrastructure Engineering</h2><ul><li>Dedicated servers and VPS.</li><li>Shared hosting and managed hosting.</li><li>Web server architecture.</li><li>Nginx and Apache.</li><li>Application servers.</li><li>Reverse proxies.</li><li>Server configuration and hardening.</li><li>SSH and remote administration.</li><li>Domain registration and DNS management.</li><li>SSL certificate management.</li><li>Storage and backup infrastructure.</li><li>Server resource management.</li><li>High availability and redundancy.</li><li>Infrastructure automation.</li><li>Disaster recovery.</li><li>Capacity planning.</li></ul><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>UNIX and Linux System Administration Handbook</i></b>, 5th ed. (2017), by Nemeth, Snyder, Hein, Whaley, Mackin.</li><li><b><i>The Practice of System and Network Administration</i></b>, 3rd ed. (2016), by Limoncelli, Hogan, Chalup.</li><li><b><i>NGINX Cookbook</i></b>, 3rd ed. (2024), by Derek DeJonghe.</li></ul><h2 data-sa=\"sa-cloud-computing-distributed-systems\">Cloud Computing &amp; Distributed Systems</h2><ul><li>Cloud computing fundamentals.</li><li>AWS, Microsoft Azure and Google Cloud.</li><li>Infrastructure as a Service (IaaS).</li><li>Platform as a Service (PaaS).</li><li>Software as a Service (SaaS).</li><li>Function as a Service (FaaS).</li><li>Virtual machines and hypervisors.</li><li>Containers and container orchestration.</li><li>Docker and Kubernetes.</li><li>Microservices architecture.</li><li>Distributed computing.</li><li>Distributed databases.</li><li>Message queues and event-driven architecture.</li><li>Service discovery.</li><li>Fault tolerance and resilience.</li><li>Scalability and horizontal/vertical scaling.</li><li>Edge and serverless computing.</li><li>Multi-cloud and hybrid-cloud architecture.</li><li>Cloud security and governance.</li></ul><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>Cloud Computing: Concepts, Technology, Security, and Architecture</i></b>, 2nd ed. (2023), by Erl, Barceló Monroy.</li><li><b><i>Distributed Systems</i></b>, 4th ed. (2023), by van Steen, Tanenbaum.</li><li><b><i>Designing Data-Intensive Applications</i></b>, 2nd ed. (2026), by Kleppmann, Riccomini.</li><li><b><i>Kubernetes in Action</i></b>, 2nd ed. (2026), by Lukša, Conner.</li><li><b><i>Building Microservices</i></b>, 2nd ed. (2021), by Sam Newman.</li></ul><h2 data-sa=\"sa-devops-devsecops-site-reliability-engineering\">DevOps, DevSecOps &amp; Site Reliability Engineering</h2><ul><li>CI/CD pipelines.</li><li>Continuous integration and deployment.</li><li>Infrastructure as Code (IaC).</li><li>Configuration management.</li><li>Automated build and deployment.</li><li>Docker and Kubernetes operations.</li><li>Git workflows and branching strategies.</li><li>Terraform and Ansible.</li><li>Environment management (development, staging, production).</li><li>Monitoring and observability.</li><li>Centralized logging.</li><li>Metrics, tracing and alerting.</li><li>Incident management.</li><li>Reliability engineering.</li><li>Service Level Indicators, Objectives and Agreements (SLIs, SLOs, SLAs).</li><li>Performance and capacity optimization.</li><li>Release management and rollback strategies.</li><li>DevSecOps and security automation.</li><li>Backup, recovery and business continuity.</li></ul><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>The DevOps Handbook</i></b>, 2nd ed. (2021), by Kim, Humble, Debois, Willis, Forsgren.</li><li><b><i>Site Reliability Engineering</i></b>, 1st ed. (2016, free online), by Beyer, Jones, Petoff, Murphy.</li><li><b><i>Terraform: Up and Running</i></b>, 3rd ed. (2022), by Yevgeniy Brikman.</li><li><b><i>Ansible: Up and Running</i></b>, 3rd ed. (2022), by Geerling, Hochstein, Moser.</li><li><b><i>Docker Deep Dive</i></b>, updated regularly, buy the latest, by Nigel Poulton.</li><li><b><i>Observability Engineering</i></b>, 1st ed. (2022), by Majors, Fong-Jones, Miranda.</li></ul><h2 data-sa=\"sa-embedded-iot-edge-systems\">Embedded, IoT &amp; Edge Systems</h2><ul><li>Embedded software architecture.</li><li>Microcontroller programming.</li><li>Real-time operating systems (RTOS).</li><li>Firmware development.</li><li>Hardware-software integration.</li><li>IoT communication protocols.</li><li>MQTT and CoAP.</li><li>Device authentication.</li><li>Secure firmware updates.</li><li>Edge computing.</li><li>Industrial control systems.</li><li>Operational Technology (OT) security.</li><li>Industrial IoT security.</li></ul><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>Making Embedded Systems</i></b>, 2nd ed. (2024), by Elecia White.</li><li><b><i>Mastering the FreeRTOS Real Time Kernel</i></b>, free from FreeRTOS.org, by Richard Barry.</li><li><b><i>IoT and Edge Computing for Architects</i></b>, 2nd ed. (2020), by Perry Lea.</li><li><b><i>Practical IoT Hacking</i></b>, 1st ed. (2021), by Chantzis, Stais, Calderon, Deirmentzoglou, Woods.</li><li><b><i>Industrial Cybersecurity</i></b>, 2nd ed. (2021), by Pascal Ackerman.</li></ul><h1>Software Architecture &amp; Application Engineering</h1><h2 data-sa=\"sa-software-architecture-design\">Software Architecture &amp; Design</h2><ul><li>Software development lifecycle (SDLC).</li><li>Requirements engineering.</li><li>Functional and non-functional requirements.</li><li>Architectural patterns.</li><li>Monolithic and modular architecture.</li><li>Microservices and service-oriented architecture.</li><li>Event-driven architecture.</li><li>Domain-Driven Design (DDD).</li><li>Clean Architecture.</li><li>Hexagonal Architecture.</li><li>SOLID principles.</li><li>Design patterns and anti-patterns.</li><li>Separation of concerns.</li><li>Dependency injection.</li><li>Scalability and maintainability.</li><li>Legacy system architecture.</li><li>Reverse engineering and software reconstruction.</li><li>Technical documentation and architecture diagrams.</li></ul><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>Fundamentals of Software Architecture</i></b>, 2nd ed. (2025), by Richards, Ford.</li><li><b><i>Mastering the Requirements Process</i></b>, 4th ed. (2024), by Robertson, Robertson.</li><li><b><i>Clean Architecture</i></b>, 1st ed. (2017), by Robert C. Martin.</li><li><b><i>Learning Domain-Driven Design</i></b>, 1st ed. (2021), by Vlad Khononov.</li><li><b><i>Head First Design Patterns</i></b>, 2nd ed. (2020), by Freeman, Robson.</li></ul><h2 data-sa=\"sa-web-development\">Web Development</h2><ul><li>HTML and semantic markup.</li><li>CSS and responsive design.</li><li>JavaScript and TypeScript.</li><li>Frontend frameworks (React, Vue, Angular).</li><li>Backend development.</li><li>Server-side rendering and static generation.</li><li>Full-stack development.</li><li>PHP, Node.js, Python, Java or .NET backends.</li><li>Routing and middleware.</li><li>Authentication and authorization.</li><li>Sessions and cookies.</li><li>Form handling and validation.</li><li>File uploads and storage.</li><li>WebSockets and real-time applications.</li><li>Progressive Web Applications (PWAs).</li><li>Browser architecture and rendering.</li><li>Cross-browser compatibility.</li><li>Accessibility and web standards.</li><li>Website performance optimization.</li></ul><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>CSS: The Definitive Guide</i></b>, 5th ed. (2023), by Meyer, Weyl.</li><li><b><i>Fluent React</i></b>, 1st ed. (2024), by Tejas Kumar.</li><li><b><i>Node.js Design Patterns</i></b>, 4th ed. (2025), by Casciaro, Mammino.</li><li><b><i>Web Browser Engineering</i></b>, 1st ed. (2025), by Panchekha, Harrelson.</li></ul><p><i>HTML, accessibility and web standards are best learned from the MDN Web Docs and the WHATWG and W3C specifications.</i></p><h2 data-sa=\"sa-application-development\">Application Development</h2><ul><li>Desktop application development.</li><li>Native mobile development (Android and iOS).</li><li>Cross-platform development.</li><li>Hybrid applications.</li><li>Progressive Web Applications.</li><li>Application lifecycle management.</li><li>Local and remote data storage.</li><li>Application state management.</li><li>Device APIs and hardware integration.</li><li>Notifications and background processing.</li><li>Application packaging and distribution.</li><li>Application permissions and sandboxing.</li><li>Offline-first architecture.</li><li>Application performance and optimization.</li><li>Reverse engineering and compatibility.</li></ul><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>Android Programming: The Big Nerd Ranch Guide</i></b>, 5th ed. (2022), by Sills, Gardner, Marsicano, Stewart.</li><li><b><i>Kotlin in Action</i></b>, 2nd ed. (2024), by Aigner, Elizarov, Isakova, Jemerov.</li><li><b><i>iOS 18 Programming for Beginners</i></b>, 9th ed. (2024), by Sahar, Clayton.</li><li><b><i>Designing Data-Intensive Applications</i></b>, 2nd ed. (2026), by Kleppmann, Riccomini.</li></ul><p><i>Desktop and cross-platform toolkits change faster than books. Use the official Flutter, React Native, Electron or .NET MAUI documentation.</i></p><h2 data-sa=\"sa-ui-ux-product-interface-engineering\">UI/UX &amp; Product Interface Engineering</h2><ul><li>User research.</li><li>User psychology and behavior.</li><li>Information architecture.</li><li>User flows and journey mapping.</li><li>Wireframing and prototyping.</li><li>Interface design principles.</li><li>Design systems and component libraries.</li><li>Typography, color and visual hierarchy.</li><li>Responsive and adaptive interfaces.</li><li>Accessibility (WCAG).</li><li>Interaction design.</li><li>Usability testing.</li><li>Conversion Rate Optimization (CRO).</li><li>Frontend implementation of designs.</li><li>Design-to-development workflows.</li><li>Product analytics and user feedback.</li></ul><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>About Face</i></b>, 4th ed. (2014), by Cooper, Reimann, Cronin, Noessel.</li><li><b><i>Laws of UX</i></b>, 2nd ed. (2024), by Jon Yablonski.</li><li><b><i>Information Architecture</i></b>, 4th ed. (2015), by Rosenfeld, Morville, Arango.</li><li><b><i>Refactoring UI</i></b>, 1st ed. (2018), by Wathan, Schoger.</li><li><b><i>Interviewing Users</i></b>, 2nd ed. (2024), by Steve Portigal.</li></ul><h2 data-sa=\"sa-api-engineering-system-integration\">API Engineering &amp; System Integration</h2><ul><li>REST API architecture.</li><li>GraphQL.</li><li>SOAP and XML-based services.</li><li>gRPC.</li><li>Webhooks.</li><li>WebSockets.</li><li>API authentication and authorization.</li><li>OAuth 2.0 and OpenID Connect.</li><li>JWT and token management.</li><li>API versioning and documentation.</li><li>Rate limiting and throttling.</li><li>API gateways.</li><li>Request validation and serialization.</li><li>Idempotency and retry mechanisms.</li><li>Service-to-service communication.</li><li>Third-party integrations.</li><li>SDK development.</li><li>API security and lifecycle management.</li></ul><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>The Design of Web APIs</i></b>, 2nd ed. (2025), by Arnaud Lauret.</li><li><b><i>API Design Patterns</i></b>, 1st ed. (2021), by JJ Geewax.</li><li><b><i>Mastering API Architecture</i></b>, 1st ed. (2022), by Gough, Bryant, Auburn.</li><li><b><i>API Security in Action</i></b>, 1st ed. (2020), by Neil Madden.</li><li><b><i>OAuth 2 in Action</i></b>, 1st ed. (2017), by Richer, Sanso.</li></ul><h2 data-sa=\"sa-database-engineering-data-management\">Database Engineering &amp; Data Management</h2><ul><li>Relational databases (PostgreSQL, MySQL).</li><li>Non-relational databases (MongoDB, Redis).</li><li>SQL and advanced querying.</li><li>Database normalization and denormalization.</li><li>Database schema design.</li><li>Indexing and query optimization.</li><li>Transactions and ACID properties.</li><li>Concurrency control and isolation levels.</li><li>Database replication.</li><li>Sharding and partitioning.</li><li>Caching strategies.</li><li>Database migrations.</li><li>Data modeling.</li><li>Data integrity and consistency.</li><li>Backup and restoration.</li><li>Data warehouses and data lakes.</li><li>ETL and ELT pipelines.</li><li>Database security and auditing.</li><li>Search engines and full-text search.</li><li>Vector databases and semantic search.</li></ul><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>Database System Concepts</i></b>, 7th ed. (2019), by Silberschatz, Korth, Sudarshan.</li><li><b><i>Designing Data-Intensive Applications</i></b>, 2nd ed. (2026), by Kleppmann, Riccomini.</li><li><b><i>The Art of PostgreSQL</i></b>, 2nd ed. (2022), by Dimitri Fontaine.</li><li><b><i>High Performance MySQL</i></b>, 4th ed. (2021), by Botros, Tinley.</li><li><b><i>The Data Warehouse Toolkit</i></b>, 3rd ed. (2013), by Kimball, Ross.</li><li><b><i>AI-Powered Search</i></b>, 1st ed. (2025), by Grainger, Turnbull, Irwin.</li></ul><h1>Software Quality, Testing &amp; Performance</h1><h2 data-sa=\"sa-software-testing-quality-assurance\">Software Testing &amp; Quality Assurance</h2><ul><li>Unit testing.</li><li>Integration testing.</li><li>System testing.</li><li>End-to-end testing.</li><li>Functional testing.</li><li>Regression testing.</li><li>Smoke and sanity testing.</li><li>Acceptance testing.</li><li>Exploratory testing.</li><li>Test-driven development (TDD).</li><li>Behavior-driven development (BDD).</li><li>Automated testing.</li><li>Mocking and test doubles.</li><li>API testing.</li><li>UI testing.</li><li>Cross-browser and cross-device testing.</li><li>Load and stress testing.</li><li>Chaos engineering.</li><li>Static code analysis.</li><li>Software quality metrics.</li><li>Continuous testing.</li></ul><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>Effective Software Testing</i></b>, 1st ed. (2022), by Maurício Aniche.</li><li><b><i>Unit Testing Principles, Practices, and Patterns</i></b>, 1st ed. (2020), by Vladimir Khorikov.</li><li><b><i>Full Stack Testing</i></b>, 1st ed. (2022), by Gayathri Mohan.</li><li><b><i>Chaos Engineering</i></b>, 1st ed. (2020), by Rosenthal, Jones.</li></ul><h3 data-sa=\"sa-software-reverse-engineering-legacy-systems\">Software Reverse Engineering &amp; Legacy Systems</h3><ul><li>Black-box software analysis.</li><li>White-box software analysis.</li><li>Protocol reverse engineering.</li><li>Binary analysis.</li><li>Legacy application maintenance.</li><li>Database and schema reconstruction.</li><li>API behavior reconstruction.</li><li>Software interoperability.</li><li>Compatibility engineering.</li><li>Migration and modernization.</li><li>Dependency mapping.</li><li>System behavior replication.</li></ul><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>Working Effectively with Legacy Code</i></b>, 1st ed. (2004), by Michael Feathers.</li><li><b><i>Kill It with Fire</i></b>, 1st ed. (2021), by Marianne Bellotti.</li><li><b><i>Practical Binary Analysis</i></b>, 1st ed. (2018), by Dennis Andriesse.</li><li><b><i>The Ghidra Book</i></b>, 2nd ed. (2020), by Eagle, Nance.</li><li><b><i>Attacking Network Protocols</i></b>, 1st ed. (2017), by James Forshaw.</li></ul><h2 data-sa=\"sa-performance-engineering-optimization\">Performance Engineering &amp; Optimization</h2><ul><li>Algorithmic optimization.</li><li>CPU and memory profiling.</li><li>Database performance optimization.</li><li>Query analysis.</li><li>Network latency ty: Principles and Practice</i></b>, 5th ed. (2023), by Stallings, Brown.</li><li><b><i>Threat Modeling: Designing for Security</i></b>, 1st ed. (2014), by Adam Shostack.</li><li><b><i>Zero Trust Networks</i></b>, 2nd ed. (2024), by Rais, Morillo, Gilman, Barth.</li></ul><h2 data-sa=\"sa-application-security-secure-software-development\">Application Security &amp; Secure Software Development</h2><ul><li>Secure Software Development Lifecycle (SSDLC).</li><li>Secure coding principles.</li><li>Input validation and output encoding.</li><li>Injection vulnerabilities.</li><li>Cross-Site Scripting (XSS).</li><li>Cross-Site Request Forgery (CSRF).</li><li>Server-Side Request Forgery (SSRF).</li><li>Broken access control.</li><li>Authentication and session vulnerabilities.</li><li>Insecure deserialization.</li><li>File upload vulnerabilities.</li><li>Path traversal.</li><li>Race conditions.</li><li>Memory corruption and buffer overflows.</li><li>API security.</li><li>Business logic vulnerabilities.</li><li>Dependency and supply-chain vulnerabilities.</li><li>Secrets management.</li><li>Secure configuration.</li><li>Security code reviews.</li><li>Software composition analysis.</li><li>OWASP Top 10 and OWASP API Security Top 10.</li></ul><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>Web Application Security</i></b>, 2nd ed. (2024), by Andrew Hoffman.</li><li><b><i>Designing Secure Software</i></b>, 1st ed. (2021), by Loren Kohnfelder.</li><li><b><i>The Art of Software Security Assessment</i></b>, 1st ed. (2006), by Dowd, McDonald, Schuh.</li><li><b><i>Software Supply Chain Security</i></b>, 1st ed. (2024), by Cassie Crossley.</li></ul><p><i>Pair these with the current OWASP Top 10, OWASP API Security Top 10 and the OWASP Cheat Sheet Series.</i></p><h2 data-sa=\"sa-network-infrastructure-security\">Network &amp; Infrastructure Security</h2><ul><li>Network security architecture.</li><li>Firewall configuration and management.</li><li>IDS and IPS.</li><li>Network segmentation.</li><li>Endpoint security.</li><li>Endpoint Detection and Response (EDR).</li><li>Secure remote access.</li><li>VPN security.</li><li>Wireless security.</li><li>DNS security.</li><li>TLS and certificate security.</li><li>Server hardening.</li><li>Linux and Windows security.</li><li>Active Directory security.</li><li>Cloud infrastructure security.</li><li>Container and Kubernetes security.</li><li>Infrastructure vulnerability management.</li><li>Patch management.</li><li>Network security monitoring.</li><li>Security information and event management (SIEM).</li></ul><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>Defensive Security Handbook</i></b>, 2nd ed. (2024), by Brotherston, Berlin, Reyor.</li><li><b><i>The Practice of Network Security Monitoring</i></b>, 1st ed. (2013), by Richard Bejtlich.</li><li><b><i>Windows Security Internals</i></b>, 1st ed. (2024), by James Forshaw.</li><li><b><i>Practical Cloud Security</i></b>, 2nd ed. (2023), by Chris Dotson.</li><li><b><i>Hacking Kubernetes</i></b>, 1st ed. (2021), by Martin, Hausenblas.</li></ul><h2 data-sa=\"sa-penetration-testing-vulnerability-research\">Penetration Testing &amp; Vulnerability Research</h2><ul><li>Penetration testing methodologies.</li><li>Rules of engagement and authorization.</li><li>Reconnaissance and asset discovery.</li><li>Attack surface assessment.</li><li>Vulnerability identification and validation.</li><li>Web application security testing.</li><li>API security testing.</li><li>Network security assessment.</li><li>Wireless security assessment.</li><li>Operating system security assessment.</li><li>Cloud security assessment.</li><li>Identity and access security assessment.</li><li>Vulnerability classification and prioritization.</li><li>CVE and CVSS.</li><li>Common misconfigurations.</li><li>Exploitability assessment.</li><li>Security proof-of-concept development in controlled environments.</li><li>Responsible vulnerability disclosure.</li><li>Security reporting and nd Linux forensic investigation.</li><li>Browser and application artifacts.</li><li>Database forensics.</li><li>Cloud forensics.</li><li>Mobile device forensics.</li><li>Timeline reconstruction.</li><li>Incident detection and triage.</li><li>Incident containment and recovery.</li><li>Root-cause analysis.</li><li>Threat intelligence integration.</li><li>Security incident documentation.</li><li>Post-incident analysis.</li><li>Disaster recovery and business continuity.</li></ul><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>Digital Forensics and Incident Response</i></b>, 4th ed. (2025), by Gerard Johansen.</li><li><b><i>The Art of Memory Forensics</i></b>, 1st ed. (2014), by Ligh, Case, Levy, Walters.</li><li><b><i>File System Forensic Analysis</i></b>, 1st ed. (2005), by Brian Carrier.</li><li><b><i>Practical Linux Forensics</i></b>, 1st ed. (2021), by Bruce Nikkel.</li><li><b><i>Practical Mobile Forensics</i></b>, 4th ed. (2020), by Tamma, Skulkin, Mahalik, Bommisetty.</li></ul><h2 data-sa=\"sa-advanced-security-research-threat-intelligence\">Advanced Security Research &amp; Threat Intelligence</h2><ul><li>Threat intelligence collection and analysis.</li><li>Adversary behavior frameworks (MITRE ATT&amp;CK).</li><li>Threat hunting.</li><li>Security research methodologies.</li><li>Vulnerability disclosure and coordination.</li><li>Exploit mitigation research.</li><li>Secure boot and hardware trust.</li><li>Side-channel attack concepts.</li><li>Memory safety.</li><li>Application sandboxing.</li><li>Attack simulation in authorized environments.</li><li>Security architecture evaluation.</li><li>Emerging cyber threats.</li><li>Security research reporting.</li></ul><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>Practical Threat Intelligence and Data-Driven Threat Hunting</i></b>, 2nd ed. (2026), by Valentina Costa-Gazcón.</li><li><b><i>Intelligence-Driven Incident Response</i></b>, 2nd ed. (2023), by Roberts, Brown.</li><li><b><i>Building Secure on for Data Analysis</i></b>, 3rd ed. (2022), by Wes McKinney.</li><li><b><i>Storytelling with Data</i></b>, 1st ed. (2015), by Cole Nussbaumer Knaflic.</li><li><b><i>Hands-On Machine Learning with Scikit-Learn and PyTorch</i></b>, PyTorch edition (2025), by Aurélien Géron.</li><li><b><i>Deep Learning: Foundations and Concepts</i></b>, 1st ed. (2024), by Bishop, Bishop.</li><li><b><i>AI Engineering</i></b>, 1st ed. (2025), by Chip Huyen.</li></ul><h1>Financial Technology &amp; Financial Systems</h1><h2 data-sa=\"sa-financial-technology-fintech-engineering\">Financial Technology (FinTech) Engineering</h2><p>This domain deserves particular attention because financial applications have requirements that ordinary software applications often do not: financial accuracy, transaction integrity, regulatory compliance, auditability and high security.</p><h3 data-sa=\"sa-financial-systems-concepts\">Financial Systems &amp; Concepts</h3><ul><li>Financial markets and market infrastructure.</li><li>Banking systems and banking architecture.</li><li>Payment systems and payment processing.</li><li>Accounting fundamentals.</li><li>Double-entry bookkeeping.</li><li>Financial statements and reporting.</li><li>Assets, liabilities and equity.</li><li>Cash flow management.</li><li>Interest rates and compounding.</li><li>Foreign exchange (Forex).</li><li>Securities and financial instruments.</li><li>Bonds, equities and derivatives.</li><li>Trading and brokerage infrastructure.</li><li>Risk management.</li><li>Settlement and clearing.</li><li>Liquidity management.</li></ul><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>The Economics of Money, Banking and Financial Markets</i></b>, 13th ed. (2022), by Frederic S. Mishkin.</li><li><b><i>Financial Accounting with International Financial Reporting Standards</i></b>, 5th ed. (2022), by Weygandt, Kimmel, Kieso.</li><li><b><i>Investments</i></b>, 13th ed. (2024), by Bodie, Kane, Marcus.</li><li><b><i>Options, Futures, and Other Derivatives</i></b>, 11th ed. (2021), by John C. Hull.</li><li><b><i>Risk Management and Financial Institutions</i></b>, 6th ed. (2023), by John C. Hull.</li></ul><h3 data-sa=\"sa-payment-engineering\">Payment Engineering</h3><ul><li>Payment gateways and processors.</li><li>Merchant acquiring.</li><li>Card payment infrastructure.</li><li>Card authorization and settlement.</li><li>Payment orchestration.</li><li>Recurring payments and subscriptions.</li><li>Refunds, chargebacks and disputes.</li><li>Payment reconciliation.</li><li>Payment routing.</li><li>International payment systems.</li><li>SEPA and SWIFT.</li><li>Open Banking and PSD2/PSD3 concepts.</li><li>Strong Customer Authentication (SCA).</li><li>ISO 20022.</li><li>PCI DSS.</li><li>Fraud detection and prevention.</li></ul><p><b>Recommended Books</b></p><ul class=\"books\"><li><b><i>The Anatomy of the Swipe</i></b>, 1st ed. (2020), by Ahmed Siddiqui.</li><li><b><i>Payment Systems: From the Salt Mines to the Board Room</i></b>, 1st ed. (2008), by Rambure, Nacamuli.</li><li><b><i>Practical Fraud Prevention</i></b>, 1st ed. (2022), by Saporta, Maraney.</li></ul><p><i>No current book covers the European rules in depth. Use the primary sources: EPC SEPA rulebooks, EBA technical standards for SCA, the ISO 20022 message catalogue, PCI DSS v4 from the PCI Security Standards Council.</i></p><h3 data-sa=\"sa-financial-application-development\">Financial Application Development</h3><ul><li>Digital banking applications.</li><li>Personal finance management systems.</li><li>Budgeting and accounting software.</li><li>Invoicing and billing platforms.</li><li>Financial dashboards.</li><li>Trading applications.</li><li>Brokerage platforms.</li><li>Portfolio management systems.</li><li>Investment tracking systems.</li><li>Loan and credit management platforms.</li><li>Insurance technology (InsurTech).</li><li>Financial APIs and Open Banking integrations.</li><li>Automated financial workflows.</li><li>Financial data aggregation.</li><   return items.map(([title,description,freq,study],i)=>({id:uid(),title,time:'',duration:0,freq,from:T,until:null,skip:[],ovr:{},done:{},description,order:i+1,...(study?{study:true}:{})}));

function polishDesc(title,h){

  if(title==='Physical training'){

/* Day notes: hide what is not for this day and take the note itself out of the reading view. */
const DAY_W='mon(?:day)?|tue(?:s|sday)?|wed(?:s|nesday)?|thu(?:r|rs|rsday)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?';
const DAY_RE=new RegExp(`[\\s,]*\\(\\s*((?:${DAY_W})(?:\\s*[-–,]\\s*(?:${DAY_W}))*)\\s*\\)\\s*$`,'i');
const DAY_IDX={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
function parseDays(txt){
  const out=new Set();
  txt.split(',').forEach(p=>{const r=p.trim().split(/\s*[-–]\s*/).map(x=>DAY_IDX[x.slice(0,3).toLowerCase()]);
    if(r.length===1)out.add(r[0]);else for(let i=r[0],n=0;n<7;i=(i+1)%7,n++){out.add(i);if(i===r[1])break}});
  return out;
}
function stripDays(el){
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let last=null;
  while(w.nextNode())if(w.currentNode.data.trim())last=w.currentNode;
  if(last)last.data=last.data.replace(DAY_RE,'');
}
function applyDays(root,date){
  const wd=pd(date).getDay();
  root.querySelectorAll('li').forEach(li=>{const m=li.textContent.match(DAY_RE);if(!m)return;if(parseDays(m[1]).has(wd))stripDays(li);else li.remove()});
  root.querySelectorAll('ul,ol').forEach(l=>{if(!l.children.length)l.remove()});
  root.querySelectorAll('h1,h2,h3').forEach(h=>{
    if(!root.contains(h))return;const m=h.textContent.match(DAY_RE);if(!m)return;
    if(parseDays(m[1]).has(wd)){stripDays(h);if(!h.textContent.trim()){if(h.nextElementSibling)h.nextElementSibling.classList.add('day-start');h.remove()}return}
    const lvl=+h.tagName[1];let n=h.nextElementSibling;
    while(n&&!(/^H[1-3]$/.test(n.tagName)&&+n.tagName[1]<=lvl)){const x=n.nextElementSibling;n.remove();n=x}
    h.remove();
  });
}

const IDB={db:null,

function commitPending(title){
  const type=S.pending;S.pending=null;

  if(type==='task'){const q=parseQuick(title);startCreate('task',{id:uid(),title:q.title,time:q.time,duration:q.duration,description:'',freq:{type:'once'},from:S.date,until:null,skip:[],ovr:{},done:{}})}

function parseQuick(s){
  let time='',duration=0,t=' '+s+' ';
  t=t.replace(/\s(\d{1,2})[:.](\d{2})(?=\s)/,(m,a,b)=>{if(+a<24&&+b<60&&!time){time=pad(+a)+':'+b;return ' '}return m});
  t=t.replace(/\s(\d+)\s?h(?:ours?|rs?)?\s?(\d+)\s?m(?:in(?:utes?|s)?)?(?=\s)/i,(m,a,b)=>{duration=+a*60+ +b;return ' '});
  if(!duration)t=t.replace(/\s(\d+(?:[.,]\d+)?)\s?(h|hr|hrs|hours?|m|min|mins|minutes?)(?=\s)/i,(m,n,u)=>{n=parseFloat(n.replace(',','.'));duration=Math.round(/^h/i.test(u)?n*60:n);return ' '});

function statsHTML(kind,o,editing){

  const a=b.dataset.d;
  if(a==='export'||a==='copy'){
    const pw=($('#expw')||{}).value||'';b.disabled=true;
    try{const text=await buildExport(pw);
      if(a==='copy'){await navigator.clipboard.writeText(text);msg('Copied. Paste it into a file or note to keep it.')}
      else{await offerFile(`note-${todayISO()}${pw?'-protected':''}.json`,text);msg(pw?'Encrypted file exported.':'File exported.')}
      D.meta.lastBackup=Date.now();save();
    }catch(err){msg(err&&err.code==='declined'?'Export cancelled.':a==='copy'?'Copying was blocked by the browser.':'The file could not be saved here.')}
    b.disabled=false;
  }
  if(a==='cancel-imp'){S.imp=null;paintImp()}
  if(a==='unlock')tryImport(($('#imppw')||{}).value||'');
  if(a==='replace'&&S.imp&&S.imp.res){
    const res=S.imp.res;
    choiceBox('Replace your data',`Everything on this device will be replaced with the file's ${countTxt(countsOf(res.data))}. A snapshot of your current data is kept.`,[['yes','Replace my data']],async()=>{
      try{if(STORE.ready)await addSnap('import',JSON.stringify(D))}catch(x){}
      S.imp=null;useData(structuredClone(res.data));save();openData();
    });
  }
  if(a==='restore'){
    const s=await IDB.get('snaps',b.dataset.id).catch(()=>null);
    if(!s||fnv(s.json)!==s.sum){b.textContent='Damaged';return}
    choiceBox('Restore snapshot',`Go back to your data from ${whenTxt(s.savedAt)}? A snapshot of your current data is kept.`,[['yes','Restore']],async()=>{
      try{await addSnap('restore',JSON.stringify(D))}catch(x){}
      useData(JSON.parse(s.json));save();openData();
    });
  }
});
function openBackup(){openData()}
function closePop(){if(POP){POP.el.remove();POP=null}}
document.addEventListener('mousedown',e=>{if(POP&&!POP.el.contains(e.target)&&!POP.anchor.contains(e.target))closePop()},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(POP)return closePop()}
  const tg=e.target,typing=tg.closest&&tg.closest('input,textarea,select,[contenteditable="true"]');
  if(!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!document.querySelector('.overlay'))handleKeys(e);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&isEditing()){e.preventDefault();doSave()}
});

function openTablePicker(btn){
  let cells='';for(let r=1;r<=6;r++)for(let c=1;c<=8;c++)cells+=`<i data-r="${r}" data-c="${c}"></i>`;
  const el=openPop(btn,`<div class="pop-t">Insert table</div><div class="tgrid">${cells}</div><div class="muted tg-l">Choose a size</div>`);
  el.style.width='auto';
  el.addEventListener('mouseover',e=>{const i=e.target.closest('i[data-r]');if(!i)return;const R=+i.dataset.r,C=+i.dataset.c;
    el.querySelectorAll('i').forEach(x=>x.classList.toggle('on',+x.dataset.r<=R&&+x.dataset.c<=C));
    $('.tg-l',el).textContent=`${C} ${C===1?'column':'columns'}, ${R} ${R===1?'row':'rows'}`});
  el.addEventListener('click',e=>{const i=e.target.closest('i[data-r]');if(i)insertTable(+i.dataset.r,+i.dataset.c)});
}
function insertTable(rows,cols){
  restoreSel();const cell=curCell();
  if(cell){const r=document.createRange();r.setStartAfter(cell.closest('table'));r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r)}
  const html=`<table><tbody>${Array.from({length:rows},()=>`<tr>${'<td><br></td>'.repeat(cols)}</tr>`).join('')}</tbody></table><p><br></p>`;
  document.execCommand('insertHTML',false,html);closePop();validate();
}

/* ---------- start ---------- */
function handleKeys(e){
  const k=e.key,v=S.view;
  if((k===' '||k==='Enter')&&e.target.closest&&e.target.closest('button'))return;
  if(k==='Escape'){if(isEditing())$('[data-act=cancel]',infoEl).click();else if(v.kind!=='calendar')backToCal();return}
  if(k==='ArrowDown'||k==='ArrowUp'||k==='j'||k==='k'){
    const rows=[...listEl.querySelectorAll('.row[data-id]:not(.is-draft)')];if(!rows.length||isEditing())return;
    e.preventDefault();const i=rows.findIndex(r=>r.classList.contains('is-sel'));
    const n=rows[Math.max(0,Math.min(rows.length-1,i<0?0:i+((k==='ArrowDown'||k==='j')?1:-1)))];
    openItem(S.tab==='home'?'task':'note',n.dataset.id);$(`.row[data-id="${n.dataset.id}"]`,listEl)?.scrollIntoView({block:'nearest'});return}
  if((k===' '||k==='x')&&v.kind==='task'&&v.mode==='view'){e.preventDefault();toggleTask(v.id);return}
  if((k==='Enter'||k==='e')&&v.kind!=='calendar'&&v.mode==='view'){e.preventDefault();$('[data-act=edit]',infoEl).click();return}
  if(k==='n'){e.preventDefault();$('[data-new=task]').click();return}
  if(k==='t'){S.cal=monthStart(todayISO());setDate(todayISO(),true);return}
}
setInterval(()=>{if(S.tab==='home'&&S.date===todayISO()&&!S.pending)renderList()},60000);
save();renderToolbar();renderList(true);renderInfo();
storageBoot();
if('serviceWorker' in navigator&&window.top===window&&(location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
